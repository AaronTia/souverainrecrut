# Serveur de déploiement SouverainRecrut (VM Ubuntu sous VMware)
# La clé privée est montée dans le conteneur Ansible : voir run-ansible.ps1
[app]
192.168.139.128 ansible_user=x ansible_ssh_private_key_file=/root/.ssh/id_ed25519

[app:vars]
ansible_python_interpreter=/usr/bin/python3
deploy_dir=/opt/souverainrecrut
