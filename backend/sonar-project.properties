# Configuration de l'analyse SonarQube du backend SouverainRecrut.
# Le serveur (sonar.host.url) et le token sont fournis par Jenkins
# via withSonarQubeEnv('sonar') : aucun secret ici.

sonar.projectKey=souverainrecrut-backend
sonar.projectName=souverainrecrut-backend
sonar.sourceEncoding=UTF-8

# Code applicatif et tests
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/docs/**

# Couverture produite par Jest (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mêmes exclusions que collectCoverageFrom dans jest.config.js
sonar.coverage.exclusions=src/server.ts,src/config/prisma.ts,src/**/*.d.ts

sonar.typescript.tsconfigPaths=tsconfig.json
